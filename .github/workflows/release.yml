# Release workflow.
#
# Do not copy this file blindly. It is designed to be adaptable, not
# dropped in as-is: take the parts you need and adjust them for your
# own project, its build, and its conventions.
#
# This file depends on repository configuration that is not visible here.
# If this workflow is copied, forked, or migrated, re-apply all of these:
#
#   1. Release immutability enabled
#      (Settings > General > Releases > Enable release immutability)
#   2. Environment "release" with required reviewers
#      (Settings > Environments)
#   3. Deployment branch policy on the "release" environment
#      restricted to "main" and "release/*" (keep in sync with
#      DEFAULT_RELEASE_BRANCH and HOTFIX_BRANCH_PREFIX below)
#   4. Artifact attestations require a public repo or GitHub
#      Enterprise Cloud
#
# Runner note: ubuntu-24.04 is pinned deliberately. Renovate updates
# the runs-on pins via the github-runners datasource; do not replace
# them with ubuntu-latest, which Renovate cannot manage.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (for example v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  # Queue rather than cancel: cancelling a run after its draft release
  # exists triggers that run's cleanup job, which deletes the draft for
  # this tag — including one a newer run for the same tag just created.
  cancel-in-progress: false

env:
  DEFAULT_RELEASE_BRANCH: main
  HOTFIX_BRANCH_PREFIX: release/
  ARTIFACT_NAME: release-asset.zip
  # renovate: datasource=pypi depName=awesomeversion
  AWESOMEVERSION_VERSION: "25.8.0"

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # The "release" environment's deployment branch policy already
      # blocks publishing from other branches, but only at the final
      # approval gate. Fail fast instead of burning a full
      # build/attest/draft cycle on a dispatch that can never publish.
      - name: Ensure release is dispatched from the default branch or a release branch
        if: github.ref != format('refs/heads/{0}', env.DEFAULT_RELEASE_BRANCH) && !startsWith(github.ref, format('refs/heads/{0}', env.HOTFIX_BRANCH_PREFIX))
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Releases must be dispatched from $DEFAULT_RELEASE_BRANCH or ${HOTFIX_BRANCH_PREFIX}*, not '$REF'" >&2
          exit 1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install awesomeversion
        run: |
          python -m pip install --disable-pip-version-check \
            "awesomeversion==${AWESOMEVERSION_VERSION}"

      # Validation also guarantees the tag is safe to use as a shell
      # argument downstream. Do not remove or weaken.
      - name: Validate tag
        shell: python
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          REF: ${{ github.ref }}
        run: |
          import os
          import re
          import sys

          from awesomeversion import AwesomeVersion, AwesomeVersionStrategy
          from awesomeversion.exceptions import AwesomeVersionStrategyException

          tag = os.environ["TAG"].removeprefix("v")
          want_prerelease = os.environ["PRERELEASE"] == "true"

          try:
              version = AwesomeVersion(
                  tag,
                  ensure_strategy=[
                      AwesomeVersionStrategy.SEMVER,
                      AwesomeVersionStrategy.PEP440,
                  ],
              )
          except AwesomeVersionStrategyException:
              sys.exit(f"'{tag}' is not a valid SemVer or PEP 440 version")

          is_prerelease = any(
              (version.alpha, version.beta, version.dev, version.release_candidate)
          )

          if is_prerelease and not want_prerelease:
              sys.exit(f"'{tag}' is a pre-release version, but the prerelease input is not set")
          if want_prerelease and not is_prerelease:
              sys.exit(f"The prerelease input is set, but '{tag}' is not a pre-release version")

          # A maintenance branch may only release tags from its own
          # series: release/1.2.x accepts 1.2.*, nothing else.
          ref = os.environ["REF"]
          hotfix_prefix = os.environ["HOTFIX_BRANCH_PREFIX"]
          if ref.startswith(f"refs/heads/{hotfix_prefix}"):
              branch = ref.removeprefix("refs/heads/")
              series_match = re.fullmatch(r"v?(\d+(?:\.\d+)*)(?:\.x)?", branch.removeprefix(hotfix_prefix))
              if series_match is None:
                  sys.exit(f"Release branch '{branch}' does not follow the '{hotfix_prefix}<major>.<minor>.x' naming convention")
              series = series_match.group(1)
              if not f"{tag}.".startswith(f"{series}."):
                  sys.exit(f"Tag '{tag}' is not part of the '{series}' series released from '{branch}'")

          print(f"Tag '{tag}' is valid ({version.strategy}, prerelease={is_prerelease})")

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Simulated build: stamp the release version into the VERSION
          # constant. The tag is safe in the sed replacement because
          # validate only lets SemVer/PEP 440 characters through.
          version="${TAG#v}"
          sed -i "s/^const VERSION = \".*\";$/const VERSION = \"${version}\";/" src/index.js
          grep -Fx "const VERSION = \"${version}\";" src/index.js
          mkdir dist
          cp src/index.js dist/

      - name: Create zip archive
        run: |
          # Deterministic zip: fixed mtimes, sorted entries, no extra
          # fields, UTC timestamps. Regular files only; symlinks and
          # empty directories are intentionally excluded.
          cd dist
          find . -type f -exec touch -d '2000-01-01T00:00:00Z' {} +
          find . -type f | LC_ALL=C sort | TZ=UTC zip -X "../$ARTIFACT_NAME" -@

      - name: Generate checksums
        run: |
          for algo in md5 sha1 sha256; do
            "${algo}sum" "$ARTIFACT_NAME" > "$ARTIFACT_NAME.$algo"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            ${{ env.ARTIFACT_NAME }}
            ${{ env.ARTIFACT_NAME }}.md5
            ${{ env.ARTIFACT_NAME }}.sha1
            ${{ env.ARTIFACT_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7

  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Attest build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ env.ARTIFACT_NAME }}

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: attest
    permissions:
      contents: read
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Verify checksums
        run: |
          md5sum -c "$ARTIFACT_NAME.md5"
          sha1sum -c "$ARTIFACT_NAME.sha1"
          sha256sum -c "$ARTIFACT_NAME.sha256"

      - name: Verify attestation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh attestation verify "$ARTIFACT_NAME" --repo "$REPO"

  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: verify
    permissions:
      contents: write
    steps:
      # Proceed only on a definitive 404 for both checks; treat any
      # other API failure (rate limit, auth, outage) as fatal instead
      # of silently assuming the tag or release is absent. The release
      # check also catches leftover drafts, which have no git tag.
      - name: Ensure tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          output=$(gh api "repos/$REPO/git/ref/tags/$TAG" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Tag $TAG already exists; refusing to create a release against it" >&2
            exit 1
          fi
          if ! grep -q "HTTP 404" <<<"$output"; then
            echo "Could not determine whether tag $TAG exists:" >&2
            echo "$output" >&2
            exit 1
          fi

          set +e
          output=$(gh release view "$TAG" --repo "$REPO" --json name 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "A release (or leftover draft) for $TAG already exists; refusing to create another" >&2
            exit 1
          fi
          if ! grep -qi "release not found" <<<"$output"; then
            echo "Could not determine whether a release for $TAG exists:" >&2
            echo "$output" >&2
            exit 1
          fi

      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          args=(--repo "$REPO" --target "$TARGET_SHA" --generate-notes --draft)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          # A patch release from a maintenance branch must not repoint
          # "latest" (and /releases/latest) away from the newest series.
          if [ "$REF" != "refs/heads/${DEFAULT_RELEASE_BRANCH}" ]; then
            args+=(--latest=false)
          fi
          gh release create "$TAG" "${args[@]}"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" \
            --repo "$REPO" \
            "$ARTIFACT_NAME" \
            "$ARTIFACT_NAME.md5" \
            "$ARTIFACT_NAME.sha1" \
            "$ARTIFACT_NAME.sha256"

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: draft
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          # Repeat --latest=false at publish: the "make latest" directive
          # is applied when a release goes live, not when the draft was
          # created, so relying on the draft's setting is not enough.
          args=(--repo "$REPO" --draft=false)
          if [ "$REF" != "refs/heads/${DEFAULT_RELEASE_BRANCH}" ]; then
            args+=(--latest=false)
          fi
          gh release edit "$TAG" "${args[@]}"

  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [draft, publish]
    if: needs.draft.result != 'skipped' && (failure() || cancelled())
    permissions:
      contents: write
    steps:
      - name: Delete orphaned draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          is_draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          if [ "$is_draft" = "true" ]; then
            echo "Deleting draft release for $TAG"
            gh release delete "$TAG" --repo "$REPO" --yes
          else
            echo "No draft release to clean up (state: $is_draft)"
          fi
